AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mmoa - Web App ALB Load Balancer
  - HTTPS :443 (missionmenofanna.com + www certificate from b_certificates)
    forwards to the web app instance on the app port
  - HTTP :80 redirects to HTTPS (301)

# ---------------------------------------------------------------------------
# HTTPS (mirrors car_show_management_infra/e_ALB_control_plane)
# ---------------------------------------------------------------------------
# The :443 listener imports ${ProjectName}-certificate-arn from the
# b_certificates stack, so deploy/update this stack only AFTER that stack is
# CREATE_COMPLETE (the certificate is issued). Until then the import doesn't
# exist and this update fails cleanly with nothing changed.
#
# The :80 listener redirects every request to https (same host, path and
# query, 301) — including requests to the ALB's own AWS DNS name, which then
# gets a certificate-name warning in the browser (expected: the certificate
# covers missionmenofanna.com and www only). Use the domain.
#
# Updating from the http-only version swaps the :80 listener's default
# action in place and adds :443; the target group and instance are untouched.
# The ALB SG (c_security_groups) already allows 443.
# ---------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project
        Parameters:
          - ProjectName
      - Label:
          default: Load Balancer
        Parameters:
          - AlbName
          - SslPolicy
      - Label:
          default: Target Group
        Parameters:
          - TargetGroupName
          - HealthCheckPath
    ParameterLabels:
      ProjectName:
        default: Project name (used for tags and to import shared resources)
      AlbName:
        default: ALB name
      SslPolicy:
        default: HTTPS listener SSL policy
      TargetGroupName:
        default: Target group name
      HealthCheckPath:
        default: Target group health check path

Parameters:
  ProjectName:
    Type: String
    Default: mmoa
    Description: >
      Prefix used in tags and to import VPC, subnets, security groups, the app
      port, and the web app EC2 instance ID from earlier stacks.
    MinLength: 2
    MaxLength: 32
    AllowedPattern: ^[a-z][a-z0-9-]*$
    ConstraintDescription: Lowercase letters, digits, and hyphens; must start with a letter.

  AlbName:
    Type: String
    Default: mmoa-webapp-alb
    Description: Name of the Application Load Balancer.
    MaxLength: 32

  SslPolicy:
    Type: String
    Default: ELBSecurityPolicy-TLS13-1-2-2021-06
    Description: Predefined SSL security policy used by the HTTPS listener.

  TargetGroupName:
    Type: String
    Default: mmoa-webapp-tg
    Description: Name of the target group.
    MaxLength: 32

  # mmoa_web_app serves GET /health as a dependency-free liveness check
  # (200, no DB access, mounted before logging/sessions/maintenance mode), so
  # a busy database or maintenance mode never pulls the target out of service.
  HealthCheckPath:
    Type: String
    Default: /health
    Description: HTTP path the target group health check probes (mmoa_web_app GET /health).

Resources:

  # ---------- Application Load Balancer ----------
  # In the ALB inbound SG (80/443 from the world) AND the web app SG, so the
  # app SG's self-ingress rule lets it reach the instance on the app port.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref AlbName
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets:
        - Fn::ImportValue: !Sub ${ProjectName}-public-subnet-1-id
        - Fn::ImportValue: !Sub ${ProjectName}-public-subnet-2-id
      SecurityGroups:
        - Fn::ImportValue: !Sub ${ProjectName}-alb-sg-id
        - Fn::ImportValue: !Sub ${ProjectName}-app-sg-id
      Tags:
        - Key: Name
          Value: !Ref AlbName

  # ---------- Target Group (registers the web app instance on the app port) ----------
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Ref TargetGroupName
      TargetType: instance
      Protocol: HTTP
      ProtocolVersion: HTTP1
      Port:
        Fn::ImportValue: !Sub ${ProjectName}-app-port
      VpcId:
        Fn::ImportValue: !Sub ${ProjectName}-vpc-id
      IpAddressType: ipv4
      HealthCheckProtocol: HTTP
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckPort: traffic-port
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: '200'
      Targets:
        - Id:
            Fn::ImportValue: !Sub ${ProjectName}-ec2-web-app-instance-id
          Port:
            Fn::ImportValue: !Sub ${ProjectName}-app-port
      Tags:
        - Key: Name
          Value: !Ref TargetGroupName

  # ---------- HTTPS Listener (443, apex + www cert) → forward to the web app ----------
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: !Ref SslPolicy
      Certificates:
        - CertificateArn:
            Fn::ImportValue: !Sub ${ProjectName}-certificate-arn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- HTTP Listener (80) → redirect to HTTPS ----------
  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: '443'
            Host: '#{host}'
            Path: '/#{path}'
            Query: '#{query}'
            StatusCode: HTTP_301

Outputs:
  LoadBalancerArn:
    Description: ALB ARN
    Value: !Ref LoadBalancer
    Export:
      Name: !Sub ${ProjectName}-alb-arn

  LoadBalancerDnsName:
    Description: ALB public DNS name (the Route53 alias target of f_DNS_Records)
    Value: !GetAtt LoadBalancer.DNSName
    Export:
      Name: !Sub ${ProjectName}-alb-dns-name

  LoadBalancerCanonicalHostedZoneId:
    Description: ALB canonical hosted zone ID (required for the Route53 A alias records in f_DNS_Records)
    Value: !GetAtt LoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub ${ProjectName}-alb-canonical-hosted-zone-id

  TargetGroupArn:
    Description: Target group ARN
    Value: !Ref TargetGroup
    Export:
      Name: !Sub ${ProjectName}-target-group-arn

  HttpsListenerArn:
    Description: HTTPS (:443) listener ARN
    Value: !Ref HttpsListener
    Export:
      Name: !Sub ${ProjectName}-https-listener-arn

  HttpListenerArn:
    Description: HTTP (:80, redirect to HTTPS) listener ARN
    Value: !Ref HttpListener
    Export:
      Name: !Sub ${ProjectName}-http-listener-arn
