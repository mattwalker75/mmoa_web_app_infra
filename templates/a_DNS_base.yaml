AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mmoa - Route53 hosted zone for missionmenofanna.com
  - Recreates the records the domain has at GoDaddy today so email keeps
    working when the nameservers move: Microsoft 365 (MX, verification +
    SPF TXT, autodiscover / email / msoid CNAMEs) and Teams (lyncdiscover /
    sip CNAMEs, two SRVs)
  - GoDaddy Payments pay links (pay CNAME)
  - The old GoDaddy Website Builder site is NOT carried over by default
    (LegacyWebsiteIps blank); f_DNS_Records points the apex and www at the
    web app ALB instead
  - DNS registrar is GoDaddy (until the registration is transferred)

# ---------------------------------------------------------------------------
# UNLIKE car_show_management_infra/a_DNS_base (reference only — that zone was
# made by hand), THIS STACK IS MEANT TO BE DEPLOYED: it creates the zone.
# The other stacks (b_certificates, b_SES, f_DNS_Records) take the zone as a
# HostedZoneId PARAMETER, the same way the car show stacks do — paste the
# HostedZoneId output of this stack into them.
#
# Defaults = what public DNS showed for missionmenofanna.com on 2026-10-26
# (nameservers ns13/ns14.domaincontrol.com), checked against GoDaddy's own
# DNS records list on 2026-10-27. Every record parameter is optional: leave
# one blank and its record is not created.
#
# Not carried over: _domainconnect (GoDaddy's own "Domain Connect" helper —
# meaningless once DNS is in Route53). No CAA record exists today, which
# lets ACM issue the certificate.
#
# ORDER (see README → "Domain, HTTPS and email"):
#   1. Deploy this stack with the defaults. The new zone answers like
#      GoDaddy does today for email, Teams and pay links — but NOT for the
#      website: the old GoDaddy Website Builder site is dropped (Matt's call,
#      2026-10-27), so the apex and www have no records here.
#   2. Deploy f_DNS_Records (apex + www → the web app ALB). It can go in
#      before the nameserver switch; records in this zone don't take effect
#      until step 3.
#   3. At GoDaddy, replace the nameservers with the 4 in the
#      HostedZoneNameServers output. Email keeps working through the
#      switch; the site becomes the web app (http until step 4).
#      Propagation: minutes to 48 hours.
#   4. Deploy b_certificates (validates through this zone) and b_SES, then
#      add the HTTPS listener to e_ALB. Until this is done, browsers
#      that visited the OLD site can't open the new one: that site sent a
#      2-year HSTS header (includeSubDomains), so they insist on https.
#
# To keep the old site answering during the move instead, set
# LegacyWebsiteIps to 13.248.243.5,76.223.105.230 and deploy f_DNS_Records
# only after HTTPS works (blank LegacyWebsiteIps first).
#
# NOTE: After this stack creates the hosted zone, AWS generates 4 Name Server
# (NS) records. Copy those into the domain registrar so the registrar
# delegates DNS to Route53. DNS propagation can take anywhere from
# 2 to 48 hours to complete worldwide.
# ---------------------------------------------------------------------------

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project
        Parameters:
          - ProjectName
          - DomainName
      - Label:
          default: Common DNS Settings
        Parameters:
          - DefaultTtl
      - Label:
          default: Microsoft 365 / Email Records (blank = not created)
        Parameters:
          - MxRecordValue
          - M365VerificationTxt
          - SpfTxt
          - AutodiscoverCnameValue
          - WebmailCnameValue
          - MsoidCnameValue
      - Label:
          default: Teams / Skype Records (blank = not created)
        Parameters:
          - LyncdiscoverCnameValue
          - SipCnameValue
          - SipTlsSrvValue
          - SipFederationTlsSrvValue
      - Label:
          default: GoDaddy services (blank = not created)
        Parameters:
          - PayCnameValue
      - Label:
          default: Old GoDaddy website (normally blank)
        Parameters:
          - LegacyWebsiteIps
    ParameterLabels:
      ProjectName:
        default: Project name (used in tags and exports)
      DomainName:
        default: Apex domain (hosted zone)
      DefaultTtl:
        default: Default TTL (seconds) for record sets
      MxRecordValue:
        default: MX record value (priority + mail host)
      M365VerificationTxt:
        default: Microsoft 365 domain verification TXT
      SpfTxt:
        default: SPF TXT record (apex)
      AutodiscoverCnameValue:
        default: autodiscover CNAME target
      WebmailCnameValue:
        default: email (webmail) CNAME target
      MsoidCnameValue:
        default: msoid CNAME target
      LyncdiscoverCnameValue:
        default: lyncdiscover CNAME target
      SipCnameValue:
        default: sip CNAME target
      SipTlsSrvValue:
        default: _sip._tls SRV value (priority weight port target)
      SipFederationTlsSrvValue:
        default: _sipfederationtls._tcp SRV value (priority weight port target)
      PayCnameValue:
        default: pay CNAME target (GoDaddy Payments pay links)
      LegacyWebsiteIps:
        default: Apex A record IPs for the old GoDaddy site (comma-separated)

Parameters:
  ProjectName:
    Type: String
    Default: mmoa
    Description: Prefix used in tags and exports.
    MinLength: 2
    MaxLength: 32
    AllowedPattern: ^[a-z][a-z0-9-]*$
    ConstraintDescription: Lowercase letters, digits, and hyphens; must start with a letter.

  DomainName:
    Type: String
    Default: missionmenofanna.com
    Description: Apex domain name for the public hosted zone.
    AllowedPattern: ^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}$
    ConstraintDescription: Must be a valid domain name (e.g. missionmenofanna.com).

  DefaultTtl:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 86400
    Description: Default TTL in seconds applied to every record set in this stack.

  # ---------- Microsoft 365 (email, via GoDaddy) ----------
  MxRecordValue:
    Type: String
    Default: 0 missionmenofanna-com.mail.protection.outlook.com.
    Description: MX record value (priority followed by the mail host, with trailing dot). Blank = no MX.

  M365VerificationTxt:
    Type: String
    Default: NETORG18292252.onmicrosoft.com
    Description: Microsoft 365 domain verification token (added as a TXT value at the apex). Blank = omitted.

  SpfTxt:
    Type: String
    Default: v=spf1 include:secureserver.net -all
    Description: >
      SPF policy for the apex (added as a TXT value at the apex). Blank =
      omitted. SES does not need an entry here: b_SES publishes its own SPF on
      the MAIL FROM subdomain (mail.<domain>).

  AutodiscoverCnameValue:
    Type: String
    Default: autodiscover.outlook.com.
    Description: Target hostname for the autodiscover CNAME record (with trailing dot). Blank = no record.

  WebmailCnameValue:
    Type: String
    Default: email.secureserver.net.
    Description: Target hostname for the email (webmail) CNAME record (with trailing dot). Blank = no record.

  MsoidCnameValue:
    Type: String
    Default: clientconfig.microsoftonline-p.net.
    Description: >
      Target of the msoid CNAME GoDaddy adds for Microsoft 365 (with trailing
      dot). Microsoft treats this record as legacy; keep it for an identical
      move and drop it later if desired. Blank = no record.

  # ---------- Teams / Skype for Business ----------
  LyncdiscoverCnameValue:
    Type: String
    Default: webdir.online.lync.com.
    Description: Target of the lyncdiscover CNAME (with trailing dot). Blank = no record.

  SipCnameValue:
    Type: String
    Default: sipdir.online.lync.com.
    Description: Target of the sip CNAME (with trailing dot). Blank = no record.

  SipTlsSrvValue:
    Type: String
    Default: 100 1 443 sipdir.online.lync.com.
    Description: Value of the _sip._tls SRV record ("priority weight port target."). Blank = no record.

  SipFederationTlsSrvValue:
    Type: String
    Default: 100 1 5061 sipfed.online.lync.com.
    Description: Value of the _sipfederationtls._tcp SRV record ("priority weight port target."). Blank = no record.

  # ---------- GoDaddy services ----------
  PayCnameValue:
    Type: String
    Default: paylinks.commerce.godaddy.com.
    Description: >
      Target of the pay CNAME (pay.<domain>) that GoDaddy Payments uses for
      pay links (with trailing dot). Carried over as-is; on 2026-10-27 it
      resolved but its https certificate did not validate, so it looks
      unused — blank it if MMoA doesn't use GoDaddy pay links. Blank = no
      record.

  # ---------- Old GoDaddy Website Builder site ----------
  LegacyWebsiteIps:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Blank (the default) = the old GoDaddy Website Builder site is not
      carried over; f_DNS_Records owns the apex and www. Only if you want the
      old site to keep answering during the move: set it to the IPs GoDaddy
      used (13.248.243.5,76.223.105.230) — that adds an apex A and a www CNAME
      — and blank it again before deploying f_DNS_Records (Route53 can't hold
      both; f_DNS_Records fails cleanly if these still exist).

Conditions:
  HasMx: !Not [!Equals [!Ref MxRecordValue, '']]
  HasVerification: !Not [!Equals [!Ref M365VerificationTxt, '']]
  HasSpf: !Not [!Equals [!Ref SpfTxt, '']]
  HasApexTxt: !Or [!Condition HasVerification, !Condition HasSpf]
  HasAutodiscover: !Not [!Equals [!Ref AutodiscoverCnameValue, '']]
  HasWebmail: !Not [!Equals [!Ref WebmailCnameValue, '']]
  HasMsoid: !Not [!Equals [!Ref MsoidCnameValue, '']]
  HasLyncdiscover: !Not [!Equals [!Ref LyncdiscoverCnameValue, '']]
  HasSip: !Not [!Equals [!Ref SipCnameValue, '']]
  HasSipTlsSrv: !Not [!Equals [!Ref SipTlsSrvValue, '']]
  HasSipFederationSrv: !Not [!Equals [!Ref SipFederationTlsSrvValue, '']]
  HasPay: !Not [!Equals [!Ref PayCnameValue, '']]
  HasLegacyWebsite: !Not [!Equals [!Join ['', !Ref LegacyWebsiteIps], '']]

Resources:

  # ---------- Public Hosted Zone ----------
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub Public hosted zone for ${DomainName}
      HostedZoneTags:
        - Key: Name
          Value: !Sub ${ProjectName}-hosted-zone

  # ---------- Apex MX (Microsoft 365 inbound mail) ----------
  ApexMxRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasMx
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: MX
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref MxRecordValue

  # ---------- Apex TXT (M365 verification + SPF) ----------
  # Both values live in ONE record set (Route53 allows a single TXT set per
  # name). Each value must be wrapped in literal double quotes per Route53 /
  # RFC 1035. A blank parameter drops just that value.
  ApexTxtRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasApexTxt
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: TXT
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !If [HasVerification, !Sub '"${M365VerificationTxt}"', !Ref 'AWS::NoValue']
        - !If [HasSpf, !Sub '"${SpfTxt}"', !Ref 'AWS::NoValue']

  # ---------- autodiscover CNAME (Outlook autodiscovery) ----------
  AutodiscoverCnameRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasAutodiscover
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub autodiscover.${DomainName}
      Type: CNAME
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref AutodiscoverCnameValue

  # ---------- email CNAME (GoDaddy webmail) ----------
  EmailCnameRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasWebmail
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub email.${DomainName}
      Type: CNAME
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref WebmailCnameValue

  # ---------- msoid CNAME (Microsoft 365 sign-in, legacy) ----------
  MsoidCnameRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasMsoid
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub msoid.${DomainName}
      Type: CNAME
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref MsoidCnameValue

  # ---------- Teams / Skype for Business ----------
  LyncdiscoverCnameRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasLyncdiscover
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub lyncdiscover.${DomainName}
      Type: CNAME
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref LyncdiscoverCnameValue

  SipCnameRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasSip
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub sip.${DomainName}
      Type: CNAME
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref SipCnameValue

  SipTlsSrvRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasSipTlsSrv
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub _sip._tls.${DomainName}
      Type: SRV
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref SipTlsSrvValue

  SipFederationTlsSrvRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasSipFederationSrv
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub _sipfederationtls._tcp.${DomainName}
      Type: SRV
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref SipFederationTlsSrvValue

  # ---------- pay CNAME (GoDaddy Payments pay links) ----------
  PayCnameRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasPay
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub pay.${DomainName}
      Type: CNAME
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref PayCnameValue

  # ---------- Old GoDaddy website (optional, off by default) ----------
  # Keeps today's site answering while DNS moves, the certificate validates
  # and HTTPS is added to the ALB. Removed by setting LegacyWebsiteIps blank;
  # f_DNS_Records then owns the apex and www.
  LegacyApexARecord:
    Type: AWS::Route53::RecordSet
    Condition: HasLegacyWebsite
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Ref DomainName
      Type: A
      TTL: !Ref DefaultTtl
      ResourceRecords: !Ref LegacyWebsiteIps

  LegacyWwwCnameRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasLegacyWebsite
    Properties:
      HostedZoneId: !Ref HostedZone
      Name: !Sub www.${DomainName}
      Type: CNAME
      TTL: !Ref DefaultTtl
      ResourceRecords:
        - !Ref DomainName

Outputs:
  HostedZoneId:
    Description: Route53 hosted zone ID — the HostedZoneId parameter of b_certificates, b_SES and f_DNS_Records
    Value: !Ref HostedZone
    Export:
      Name: !Sub ${ProjectName}-hosted-zone-id

  HostedZoneName:
    Description: Hosted zone domain name
    Value: !Ref DomainName
    Export:
      Name: !Sub ${ProjectName}-hosted-zone-name

  HostedZoneNameServers:
    Description: >
      The 4 Route53 name servers for this hosted zone — copy these to the
      domain registrar so DNS resolution is delegated to Route53. DNS
      propagation can take 2 to 48 hours to complete worldwide.
    Value: !Join [",", !GetAtt HostedZone.NameServers]
    Export:
      Name: !Sub ${ProjectName}-hosted-zone-nameservers

  LegacyWebsiteActive:
    Description: Whether the apex / www still point at the old GoDaddy site
    Value: !If [HasLegacyWebsite, 'yes', 'no']
