AWSTemplateFormatVersion: '2010-09-09'
Description: >
  mmoa network stack — small VPC, public/private subnets across 2 AZs,
  Internet Gateway, single NAT Gateway in us-east-1a, and route tables.

# NOTE: "Small" = a /24 VPC carved into four /26 subnets (59 usable IPs each).
# Two AZs are the minimum an ALB accepts, so the 2-public/2-private layout
# from car_show_management_infra is kept; only the address space shrinks.
# 10.1.0.0/24 does not overlap the myevent365 VPC (10.0.0.0/16), so the two
# can be peered later without renumbering.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Project
        Parameters:
          - ProjectName
      - Label:
          default: VPC
        Parameters:
          - VpcCidr
      - Label:
          default: Availability Zones
        Parameters:
          - AvailabilityZone1
          - AvailabilityZone2
      - Label:
          default: Public Subnets
        Parameters:
          - PublicSubnet1Cidr
          - PublicSubnet2Cidr
      - Label:
          default: Private Subnets
        Parameters:
          - PrivateSubnet1Cidr
          - PrivateSubnet2Cidr
    ParameterLabels:
      ProjectName:
        default: Project name (used as resource name prefix)
      VpcCidr:
        default: VPC CIDR block
      AvailabilityZone1:
        default: Availability Zone 1
      AvailabilityZone2:
        default: Availability Zone 2
      PublicSubnet1Cidr:
        default: Public subnet 1 CIDR (AZ1)
      PublicSubnet2Cidr:
        default: Public subnet 2 CIDR (AZ2)
      PrivateSubnet1Cidr:
        default: Private subnet 1 CIDR (AZ1)
      PrivateSubnet2Cidr:
        default: Private subnet 2 CIDR (AZ2)

Parameters:
  ProjectName:
    Type: String
    Default: mmoa
    Description: Prefix used in resource names and tags.
    MinLength: 2
    MaxLength: 32
    AllowedPattern: ^[a-z][a-z0-9-]*$
    ConstraintDescription: Lowercase letters, digits, and hyphens; must start with a letter.

  VpcCidr:
    Type: String
    Default: 10.1.0.0/24
    Description: CIDR block for the VPC.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid IPv4 CIDR (e.g. 10.1.0.0/24).

  PublicSubnet1Cidr:
    Type: String
    Default: 10.1.0.0/26
    Description: CIDR for public subnet 1 (AZ1).
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  PublicSubnet2Cidr:
    Type: String
    Default: 10.1.0.64/26
    Description: CIDR for public subnet 2 (AZ2).
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.1.0.128/26
    Description: CIDR for private subnet 1 (AZ1).
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.1.0.192/26
    Description: CIDR for private subnet 2 (AZ2).
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
    Description: Primary AZ for AZ1 subnets and the NAT Gateway.

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1b
    Description: Secondary AZ for AZ2 subnets.

Resources:

  # ---------- VPC ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      InstanceTenancy: default
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-vpc

  # ---------- Internet Gateway ----------
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-igw

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------- Public Subnets ----------
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Ref AvailabilityZone1
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-subnet-public1-${AvailabilityZone1}

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Ref AvailabilityZone2
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-subnet-public2-${AvailabilityZone2}

  # ---------- Private Subnets ----------
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Ref AvailabilityZone1
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-subnet-private1-${AvailabilityZone1}

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Ref AvailabilityZone2
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-subnet-private2-${AvailabilityZone2}

  # ---------- NAT Gateway (single, in public subnet 1) ----------
  NatGatewayEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat-eip-public1-${AvailabilityZone1}

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatGatewayEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat-public1-${AvailabilityZone1}

  # ---------- Public Route Table ----------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-rtb-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  # ---------- Private Route Tables (one per AZ, both -> NAT) ----------
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-rtb-private1-${AvailabilityZone1}

  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-rtb-private2-${AvailabilityZone2}

  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

Outputs:
  VpcId:
    Description: VPC ID
    Value: !Ref Vpc
    Export:
      Name: !Sub ${ProjectName}-vpc-id

  VpcCidr:
    Description: VPC CIDR block
    Value: !GetAtt Vpc.CidrBlock
    Export:
      Name: !Sub ${ProjectName}-vpc-cidr

  PublicSubnet1Id:
    Description: Public subnet 1 (AZ1)
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub ${ProjectName}-public-subnet-1-id

  PublicSubnet2Id:
    Description: Public subnet 2 (AZ2)
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub ${ProjectName}-public-subnet-2-id

  PrivateSubnet1Id:
    Description: Private subnet 1 (AZ1)
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${ProjectName}-private-subnet-1-id

  PrivateSubnet2Id:
    Description: Private subnet 2 (AZ2)
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${ProjectName}-private-subnet-2-id

  PublicSubnetIds:
    Description: Comma-separated list of public subnet IDs
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export:
      Name: !Sub ${ProjectName}-public-subnet-ids

  PrivateSubnetIds:
    Description: Comma-separated list of private subnet IDs
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export:
      Name: !Sub ${ProjectName}-private-subnet-ids

  InternetGatewayId:
    Description: Internet Gateway ID
    Value: !Ref InternetGateway
    Export:
      Name: !Sub ${ProjectName}-igw-id

  NatGatewayId:
    Description: NAT Gateway ID
    Value: !Ref NatGateway
    Export:
      Name: !Sub ${ProjectName}-nat-gateway-id
